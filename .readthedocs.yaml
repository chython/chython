# `.readthedocs.yaml` and not `readthedocs.yml`: the dotted name is the one Read the Docs documents,
# and it is the only spelling a project created today can use.  Both are read for now.

version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # A warning here is a broken cross-reference or a dropped file, which renders as plain text on a page
  # nobody rebuilds.  Safe to require because the build is warning-free under `-W` today; `docs/` holds
  # no autodoc directive, so nothing in this build imports chython and the extension is never compiled.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
